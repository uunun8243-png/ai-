# .github/workflows/daily-digest.yml
name: AI News Daily Digest

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00
    - cron: '0 0 * * *'
    # 北京时间 14:00 = UTC 06:00
    - cron: '0 6 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: news-digest

      - name: Determine batch
        id: batch
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "0" ]; then
            echo "batch=上午" >> $GITHUB_OUTPUT
          else
            echo "batch=下午" >> $GITHUB_OUTPUT
          fi

      - name: Run digest pipeline
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.main
        working-directory: news-digest
