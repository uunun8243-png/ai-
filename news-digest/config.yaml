feishu:
  app_id: "${FEISHU_APP_ID}"
  app_secret: "${FEISHU_APP_SECRET}"
  chat_id: "${FEISHU_CHAT_ID}"

deepseek:
  api_key: "${DEEPSEEK_API_KEY}"
  model: "deepseek-v4-flash"

sources:
  arxiv: true
  github_trending: true
  hackernews: true
  blogs: true
  reddit_ml: true
  zh_sources: true
  meta_ai: true
  huggingface: true
  deepmind: true
  venturebeat: true
  techcrunch: true

schedule:
  time: "08:00"
  timezone: "Asia/Shanghai"

scoring:
  freshness:
    half_life_news: 6
    half_life_official: 12
    half_life_academic: 48
    half_life_community: 8
    engagement_window_hours: 6
  weights:
    source: 0.15
    timeliness: 0.30
    norm: 0.15
    keyword: 0.15
  cross_source_boosts:
    2: 0.05
    3: 0.10
    4: 0.15
    5: 0.20
  github:
    min_stars: 300
    time_window_days: 7
    query_keywords: "ai"
  arxiv:
    max_papers_per_category: 20

analysis:
  max_news_per_day: 15
  candidate_pool_size: 45
  max_news_per_source: 3
  source_limits:
    OpenAI: 2
    Anthropic: 2
    Google DeepMind: 2
    Meta AI: 2
    Hugging Face: 2
    Google AI: 2
    Arxiv: 3
    GitHub Trending: 3
    Hacker News: 2
    Reddit r/MachineLearning: 2
    VentureBeat AI: 4
    TechCrunch AI: 4
    机器之心: 2
    量子位: 2
  recent_hours: 24
  source_recent_hours:
    Arxiv: 72
    GitHub Trending: 96
  sent_state_path: ".digest-state/sent_items.json"
  output_language: "zh-CN"
  require_ai_relevance: true

monetization:
  enabled: true
  max_per_day: 3
  sources:
    product_hunt: true
    indie_hackers: true
    reddit: true
  websearch_fallback: true
  sent_state_path: ".digest-state/monetization_sent_items.json"
  source_weights:
    Product Hunt: 1.0
    IndieHackers: 1.0
    Reddit: 0.8
    Hacker News: 0.7
    GitHub Trending: 0.6
