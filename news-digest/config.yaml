feishu:
  app_id: "${FEISHU_APP_ID}"
  app_secret: "${FEISHU_APP_SECRET}"
  chat_id: "${FEISHU_CHAT_ID}"

deepseek:
  api_key: "${DEEPSEEK_API_KEY}"
  model: "deepseek-v4-flash"

sources:
  arxiv: true
  github_trending: true
  hackernews: true
  blogs: true
  reddit_ml: true
  zh_sources: true

schedule:
  time: "08:00"
  timezone: "Asia/Shanghai"

analysis:
  max_news_per_day: 10
  output_language: "zh-CN"
